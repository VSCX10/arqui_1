<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V-03 Publicar o editar producto (atributos por categoría)</title><link rel="stylesheet" href="estilos.css"></head>
<body class="web"><div class="codebar">V-03</div>
<header class="top"><span class="logo">QHATU</span>
<form class="search"><input type="text" placeholder="Buscar productos..." value=""> <button class="btn p">Buscar</button></form>
<nav class="menu"><a href="#">Categorías ▾</a><a href="#">Mis pedidos</a><a href="#">Carrito (3)</a><a href="#" class="on">Vender</a><a href="#">Mi cuenta</a></nav>
<span class="burger">☰</span></header>
<main class="page">

<div class="box"><h1>Vender &gt; Publicar producto</h1>
 <div class="fl"><label>Categoría</label><select style="min-width:240px"><option>Moda &gt; Polos</option></select></div><div class="fl"><label>Título</label><input type="text" class="w4" value="" placeholder=""></div>
 <div class="fl"><label>Descripción</label><textarea rows="2"></textarea></div>
 <div class="fl"><label>Precio S/</label><input type="text" class="w2" value="" placeholder=""> Stock <input type="text" class="w1" value="" placeholder=""></div>
 <div class="fl"><label>Imágenes</label><button class="btn ">Subir imágenes</button> img1.jpg &nbsp; img2.jpg <button class="btn s">Quitar</button></div></div>
<div class="box"><h2>Atributos de la categoría "Polos" <span style="text-transform:none;letter-spacing:0">(los define el catálogo)</span></h2>
 <div class="fl"><label>Talla *</label><label><input type="checkbox" checked> S</label> <label><input type="checkbox" checked> M</label> <label><input type="checkbox" checked> L</label> <label><input type="checkbox"> XL</label></div>
 <div class="fl"><label>Color *</label><select style="min-width:110px"><option>Blanco</option></select> <button class="btn s">+ Agregar color</button></div>
 <div class="fl"><label>Material</label><select style="min-width:140px"><option>Algodón pima</option></select></div></div>
<div class="note">Las publicaciones con términos o categorías prohibidas pasan a revisión antes de ser visibles.</div>
<div class="row end"><button class="btn ">Cancelar</button> <button class="btn ">Guardar borrador</button> <button class="btn p">Publicar</button></div>
</main></body></html>
